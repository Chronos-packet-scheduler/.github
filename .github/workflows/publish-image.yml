# Reusable workflow: builds the repo's Dockerfile and pushes it to ghcr.io/<org>/<repo>.
# Pull requests build only; pushes to the default branch and v* tags also push,
# then prune untagged versions (e.g. the image `latest` pointed to before).
#
# Usage:
#
#   image:
#     needs: test
#     permissions:
#       contents: read
#       packages: write
#     uses: Chronos-packet-scheduler/.github/.github/workflows/publish-image.yml@main
name: Publish image

on:
  workflow_call:
    inputs:
      context:
        description: Docker build context
        type: string
        default: "."
      file:
        description: Path to the Dockerfile
        type: string
        default: Dockerfile
      platforms:
        description: Comma-separated target platforms
        type: string
        default: linux/amd64,linux/arm64
      cleanup:
        description: Delete untagged image versions from GHCR after pushing
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          platforms: ${{ inputs.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Each push moves `latest` (and the branch tag) to the new image, leaving the
      # previous one untagged. Remove those untagged versions. This action is
      - uses: dataaxiom/ghcr-cleanup-action@v1
        if: github.event_name != 'pull_request' && inputs.cleanup
        with:
          package: ${{ github.event.repository.name }}
          delete-untagged: true
          delete-ghost-images: true
          delete-partial-images: true
