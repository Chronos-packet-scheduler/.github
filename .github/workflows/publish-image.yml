# Reusable workflow: builds the repo's Dockerfile and pushes it to ghcr.io/<org>/<repo>.
# Pull requests build only; pushes to the default branch and v* tags also push.
#
# Usage:
#
#   image:
#     needs: test
#     permissions:
#       contents: read
#       packages: write
#     uses: Chronos-packet-scheduler/.github/.github/workflows/publish-image.yml@main
name: Publish image

on:
  workflow_call:
    inputs:
      context:
        description: Docker build context
        type: string
        default: "."
      file:
        description: Path to the Dockerfile
        type: string
        default: Dockerfile

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
